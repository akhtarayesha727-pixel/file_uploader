<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Uploader</title>
  <link rel="stylesheet" href="task5.css">
</head>
<body>
  <main class="uploader-container">
    <h2>Upload Image</h2>
    <p class="subtitle">Drag &amp; drop an image file or browse from your device</p>

    <div class="drop-zone" id="drop-zone">
      <svg class="upload-icon" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <p class="drop-text">Drop image here, or <span>browse</span></p>
      <p class="file-hint">Supports JPG, PNG, GIF</p>
      <input type="file" id="file-input" accept="image/jpeg, image/png, image/gif" hidden>
    </div>

    <div id="error-message" class="error-message hidden"></div>

    <div id="progress-container" class="progress-container hidden">
      <div class="progress-info">
        <span>Uploading...</span>
        <span id="progress-text">0%</span>
      </div>
      <div class="progress-track">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
    </div>

    <div id="preview-container" class="preview-container hidden">
      <h3>Uploaded Preview</h3>
      <div class="image-wrapper">
        <img id="preview-image" src="" alt="Preview">
      </div>
      <button id="remove-btn" type="button" class="remove-btn">Remove Image</button>
    </div>
  </main>

  <script src="task5.js"></script>
</body>
</html>
